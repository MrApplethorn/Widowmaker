<!DOCTYPE html>
<html>
  <head>
    <title>Widowmaker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Widowmaker</h1>
      <div class="reel-wrapper">
		<div class="reel-label">Objective</div>
		<div class="reel-outer">
		  <div class="reel-inner" id="inner-objective"></div>
		</div>
	  </div>
	  <div class="reel-wrapper">
		<div class="reel-label">Combat Type</div>
		<div class="reel-outer">
		  <div class="reel-inner" id="inner-combat"></div>
		  </div>
	  </div>
	  <div class="reel-wrapper">
		<div class="reel-label">Obstacles</div>
		<div class="reel-outer">
		  <div class="reel-inner" id="inner-obstacle"></div>
		  </div>
	  </div>
	  <div class="reel-wrapper">
		<div class="reel-label">Enemies</div>
		<div class="reel-outer">
		  <div class="reel-inner" id="inner-enemy"></div>
		  </div>
	  </div>
      <button id="generateButton">Generate Combat</button>
    </div>

    <script>
      const objectives = [
        "Deathmatch",
        "Sabotage",
        "Daring Escape",
        "Hold the Fort",
        "Waves of Bad Guys",
        "Escort",
        "Base Defense",
        "Yoink and Skedaddle",
        "Peace Makers",
        "The Arrest"
      ];

      const combatTypes = [
        "Skirmish",
        "Ambush",
        "Targeted Strike",
        "Horde of Bad Guys",
        "Elite Team",
        "Stomping Ground",
        "Boss Battle",
        "Puzzle"
      ];

      const obstacles = [
        "Red Barrels",
        "Siege Weapons",
        "Ammo Boxes",
        "Big Drops",
        "Doors",
        "Interactables",
        "Terrain",
        "Platforms"
      ];

      const enemyTypes = [
        "Ambusher",
        "Artillery",
        "Brute",
        "Controller",
        "Leader",
        "Support",
        "Soldier",
        "Skirmisher"
      ];

      function randomEnemyGroup() {
	const shuffled = [...enemyTypes].sort(() => Math.random() - 0.5);
	const count = Math.floor(Math.random() * 3) + 1; // 1–3 enemies
	return shuffled.slice(0, count).join(" + ");
      }

		function randomObstacleGroup() {
  const shuffled = [...obstacles].sort(() => Math.random() - 0.5);

  const count = Math.floor(Math.random() * 3) + 1; // 1–3 obstacles

  return shuffled.slice(0, count).join(" + ");
}

      const generateButton = document.getElementById("generateButton");

      function buildReel(innerEl, list, finalIndex, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(list[Math.floor(Math.random() * list.length)]);
        }

        items.push(list[finalIndex]);

        innerEl.innerHTML = '';

        items.forEach(text => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = text;
          innerEl.appendChild(div);
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';

        const targetY = -(SPIN_COUNT * 80);

        innerEl.getBoundingClientRect();

        innerEl.style.transition =
          `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

        innerEl.style.transform = `translateY(${targetY}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;

        buildReel(
          document.getElementById('inner-objective'),
          objectives,
          Math.floor(Math.random() * objectives.length),
          1800
        );

        buildReel(
          document.getElementById('inner-combat'),
          combatTypes,
          Math.floor(Math.random() * combatTypes.length),
          2200
        );

        const obstacleResults = [];

for (let i = 0; i < 30; i++) {
  obstacleResults.push(randomObstacleGroup());
}

const finalObstacle = randomObstacleGroup();

obstacleResults.push(finalObstacle);

const obstacleInner = document.getElementById('inner-obstacle');

obstacleInner.innerHTML = '';

obstacleResults.forEach(text => {
  const div = document.createElement('div');
  div.className = 'reel-item';
  div.textContent = text;
  obstacleInner.appendChild(div);
});

obstacleInner.style.transition = 'none';
obstacleInner.style.transform = 'translateY(0)';

const targetY = -(30 * 80);

obstacleInner.getBoundingClientRect();

obstacleInner.style.transition =
  `transform 2600ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

obstacleInner.style.transform = `translateY(${targetY}px)`;

        const enemyResults = [];

for (let i = 0; i < 30; i++) {
  enemyResults.push(randomEnemyGroup());
}

const finalEnemy = randomEnemyGroup();

enemyResults.push(finalEnemy);

const enemyInner = document.getElementById('inner-enemy');

enemyInner.innerHTML = '';

enemyResults.forEach(text => {
  const div = document.createElement('div');
  div.className = 'reel-item';
  div.textContent = text;
  enemyInner.appendChild(div);
});

enemyInner.style.transition = 'none';
enemyInner.style.transform = 'translateY(0)';

const targetY = -(30 * 80);

enemyInner.getBoundingClientRect();

enemyInner.style.transition =
  `transform 3000ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

enemyInner.style.transform = `translateY(${targetY}px)`;

        setTimeout(() => {
          generateButton.disabled = false;
        }, 3100);
      }

      generateButton.addEventListener("click", spinReels);

      (function initReels() {
        const reels = [
          {
            el: document.getElementById('inner-objective'),
            list: objectives
          },
          {
            el: document.getElementById('inner-combat'),
            list: combatTypes
          },
          {
            el: document.getElementById('inner-obstacle'),
            list: obstacles
          },
          {
            el: document.getElementById('inner-enemy'),
            list: enemyTypes
          }
        ];

        reels.forEach(({ el, list }) => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent =
            list[Math.floor(Math.random() * list.length)];
          el.appendChild(div);
        });
      })();
    </script>
  </body>
</html>

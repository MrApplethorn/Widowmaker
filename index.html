<!DOCTYPE html>
<html>
  <head>
    <title>Widowmaker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://mrapplethorn.github.io/styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  </head>
  <body>
    <div class="container">
      <h1>Widowmaker</h1>
      <div class="link-buttons">
        <a class="link" href="https://mrapplethorn.github.io/Oracle/">Oracle</a>
        <a class="link" href="https://mrapplethorn.github.io/Towncrier/">Towncrier</a>
      </div>
      <p class="intro-text">Unsure of what your next combat is going to look like? Click on Generate Combat to be assailed with enough inspiration to last a whole session.</p>
      <hr class="section-divider">
      <div class="reels">
        <div class="reel-wrapper">
          <div class="reel-label">Combat Objective</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-objective"></div>
          </div>
          <div class="description-panel" id="description-objective"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Combat Type</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-combat"></div>
          </div>
          <div class="description-panel" id="description-combat"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Combat Environment</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-obstacle"></div>
          </div>
          <div class="description-panel" id="description-obstacle"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Enemy Roles</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-enemy"></div>
          </div>
          <div class="description-panel" id="description-enemy"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Enemy Type</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-creature"></div>
          </div>
          <div class="description-panel" id="description-creature"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Enemy Damage Synergy</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-damage"></div>
          </div>
          <div class="description-panel" id="description-damage"></div>
        </div>
      </div>
      <button id="generateButton">Generate Combat</button>
    </div>
    
    <script src="info.js"></script>

    <script>
      function fillDescriptionPanel(panel, words) {
        const describedWords = words
          .map(word => ({ word, desc: descriptions[word] }))
          .filter(({ desc }) => desc);

        if (!describedWords.length) return false;

        panel.innerHTML = '';

        describedWords.forEach(({ word, desc }, i) => {
          if (i > 0) panel.appendChild(document.createElement('hr'));

          const title = document.createElement('strong');
          title.textContent = word;
          panel.appendChild(title);

          const body = document.createElement('p');
          body.textContent = desc;
          panel.appendChild(body);
        });

        return true;
      }

      function closeDescriptionPanels() {
        document.querySelectorAll('.description-panel.active').forEach(panel => {
          panel.classList.remove('active');
        });
      }

      function toggleDescriptionPanel(words, panelId) {
        const panel = document.getElementById(panelId);
        if (!panel) return;

        if (panel.classList.contains('active')) {
          panel.classList.remove('active');
          return;
        }

        if (!fillDescriptionPanel(panel, words)) return;

        panel.classList.add('active');
      }

      function makeReelItem(text, categoryLabel, panelId, showInfo = true) {
        const div = document.createElement('div');
        div.className = 'reel-item';

        const words = text.split(' + ');
        words.forEach((word, i) => {
          const span = document.createElement('span');
          span.textContent = word;
          div.appendChild(span);

          if (i < words.length - 1) {
            const sep = document.createElement('span');
            sep.textContent = ' + ';
            sep.className = 'separator';
            div.appendChild(sep);
          }
        });

        if (showInfo && words.some(word => descriptions[word])) {
          div.style.cursor = 'pointer';
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDescriptionPanel(words, panelId);
          });
        }

        return div;
      }

      function randomGroup(list, minCount = 1, maxCount = 3) {
        const shuffled = [...list].sort(() => Math.random() - 0.5);
        const count = Math.floor(Math.random() * (maxCount - minCount + 1)) + minCount;
        return shuffled.slice(0, count).join(' + ');
      }

      const generateButton = document.getElementById("generateButton");

      function buildGroupReel(innerEl, list, spinDuration, minCount = 1, maxCount = 3) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(randomGroup(list, minCount, maxCount));
        }
        items.push(randomGroup(list, minCount, maxCount));

        innerEl.innerHTML = '';
        items.forEach((text, i) => {
          innerEl.appendChild(makeReelItem(text, innerEl.dataset.category, innerEl.dataset.panelId, i === items.length - 1));
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${-(SPIN_COUNT * 80)}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;
        closeDescriptionPanels();

        buildGroupReel(document.getElementById('inner-objective'), objectives, 1800, 1, 2);
        buildGroupReel(document.getElementById('inner-combat'), combatTypes, 2200, 1, 2);
        buildGroupReel(document.getElementById('inner-obstacle'), obstacles, 2600, 2, 4);
        buildGroupReel(document.getElementById('inner-enemy'), enemyTypes, 3000, 1, 4);
        buildGroupReel(document.getElementById('inner-creature'), creatureTypes, 3400, 1, 2);
        buildGroupReel(document.getElementById('inner-damage'), damageTypes, 3800, 1, 2);

        setTimeout(() => {
          generateButton.disabled = false;
        }, 3900);
      }

      generateButton.addEventListener("click", spinReels);

      (function initReels() {
        const reels = [
          { el: document.getElementById('inner-objective'), category: 'Combat Objective', panelId: 'description-objective' },
          { el: document.getElementById('inner-combat'), category: 'Combat Type', panelId: 'description-combat' },
          { el: document.getElementById('inner-obstacle'), category: 'Combat Environment', panelId: 'description-obstacle' },
          { el: document.getElementById('inner-enemy'), category: 'Enemy Roles', panelId: 'description-enemy' },
          { el: document.getElementById('inner-creature'), category: 'Enemy Type', panelId: 'description-creature' },
          { el: document.getElementById('inner-damage'), category: 'Enemy Damage Synergy', panelId: 'description-damage' }
        ];

        reels.forEach(({ el, category, panelId }) => {
          el.dataset.category = category;
          el.dataset.panelId = panelId;
        });
      })();
    </script>
  </body>
</html>

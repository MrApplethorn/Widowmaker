<!DOCTYPE html>
<html>
  <head>
    <title>Widowmaker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Widowmaker</h1>
      <div class="reels">
        <div class="reel-wrapper">
          <div class="reel-label">Objective</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-objective"></div>
          </div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Combat Type</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-combat"></div>
          </div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Obstacles</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-obstacle"></div>
          </div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Enemies</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-enemy"></div>
          </div>
        </div>
      </div>
      <button id="generateButton">Generate Combat</button>
    </div>

    <script>
      const objectives = [
        "Deathmatch",
        "Sabotage",
        "Daring Escape",
        "Hold the Fort",
        "Waves of Bad Guys",
        "Escort",
        "Base Defense",
        "Yoink and Skedaddle",
        "Peace Makers",
        "The Arrest"
      ];

      const combatTypes = [
        "Skirmish",
        "Ambush",
        "Targeted Strike",
        "Horde of Bad Guys",
        "Elite Team",
        "Stomping Ground",
        "Boss Battle",
        "Puzzle"
      ];

      const obstacles = [
        "Red Barrels",
        "Siege Weapons",
        "Ammo Boxes",
        "Big Drops",
        "Doors",
        "Interactables",
        "Terrain",
        "Platforms"
      ];

      const enemyTypes = [
        "Ambusher",
        "Artillery",
        "Brute",
        "Controller",
        "Leader",
        "Support",
        "Soldier",
        "Skirmisher"
      ];

      function randomGroup(list) {
        const shuffled = [...list].sort(() => Math.random() - 0.5);
        const count = Math.floor(Math.random() * 3) + 1;
        return shuffled.slice(0, count).join(" + ");
      }

      const generateButton = document.getElementById("generateButton");

      function buildReel(innerEl, list, finalIndex, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(list[Math.floor(Math.random() * list.length)]);
        }

        items.push(list[finalIndex]);

        innerEl.innerHTML = '';

        items.forEach(text => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = text;
          innerEl.appendChild(div);
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';

        const targetY = -(SPIN_COUNT * 80);

        innerEl.getBoundingClientRect();

        innerEl.style.transition =
          `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

        innerEl.style.transform = `translateY(${targetY}px)`;
      }

      function buildGroupReel(innerEl, list, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(randomGroup(list));
        }
        items.push(randomGroup(list));

        innerEl.innerHTML = '';

        items.forEach(text => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = text;
          innerEl.appendChild(div);
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';

        innerEl.getBoundingClientRect();

        innerEl.style.transition =
          `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

        innerEl.style.transform = `translateY(${-(SPIN_COUNT * 80)}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;

        buildReel(
          document.getElementById('inner-objective'),
          objectives,
          Math.floor(Math.random() * objectives.length),
          1800
        );

        buildGroupReel(
          document.getElementById('inner-combat'),
          combatTypes,
          2200
        );

        buildGroupReel(
          document.getElementById('inner-obstacle'),
          obstacles,
          2600
        );

        buildGroupReel(
          document.getElementById('inner-enemy'),
          enemyTypes,
          3000
        );

        setTimeout(() => {
          generateButton.disabled = false;
        }, 3100);
      }

      generateButton.addEventListener("click", spinReels);

      (function initReels() {
        const reels = [
          { el: document.getElementById('inner-objective'), list: objectives, single: true },
          { el: document.getElementById('inner-combat'), list: combatTypes, single: false },
          { el: document.getElementById('inner-obstacle'), list: obstacles, single: false },
          { el: document.getElementById('inner-enemy'), list: enemyTypes, single: false }
        ];

        reels.forEach(({ el, list, single }) => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = single
            ? list[Math.floor(Math.random() * list.length)]
            : randomGroup(list);
          el.appendChild(div);
        });
      })();
    </script>
  </body>
</html>

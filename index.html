<!DOCTYPE html>
<html>
  <head>
    <title>Widowmaker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Germania One', sans-serif;
        background-color: #27272a;
        color: #fff;
        margin: 0;
        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        width: 90%;
        max-width: 900px;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .reels {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        justify-content: center;
        margin: 2rem 0;
      }

      .reel-outer {
        background: #18181b;
        border: 2px solid #52525b;
        border-radius: 10px;
        height: 80px;
        overflow: hidden;
        position: relative;
      }

      .reel-outer::before,
      .reel-outer::after {
        content: '';
        position: absolute;
        left: 0; right: 0;
        height: 22px;
        z-index: 2;
        pointer-events: none;
      }

      .reel-outer::before {
        top: 0;
        background: linear-gradient(to bottom, #18181b, transparent);
      }

      .reel-outer::after {
        bottom: 0;
        background: linear-gradient(to top, #18181b, transparent);
      }

      .reel-inner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
      }

      .reel-item {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        color: #fff;
        padding: 0 8px;
        text-align: center;
        line-height: 1.2;
        flex-shrink: 0;
      }

      button {
        width: 100%;
        padding: 15px;
        font-size: 1.2rem;
        font-family: 'Germania One', sans-serif;
        border-radius: 10px;
        border: none;
        background-color: #e40712;
        color: #fff;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      button:hover {
        background-color: #232b2f;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @media (min-width: 600px) {
        h1 {
          font-size: 2.5rem;
        }

        .reel-item {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Widowmaker</h1>

      <div class="reels">
        <div class="reel-outer">
          <div class="reel-inner" id="inner-objective"></div>
        </div>

        <div class="reel-outer">
          <div class="reel-inner" id="inner-combat"></div>
        </div>

        <div class="reel-outer">
          <div class="reel-inner" id="inner-obstacle"></div>
        </div>

        <div class="reel-outer">
          <div class="reel-inner" id="inner-enemy"></div>
        </div>
      </div>

      <button id="generateButton">Generate Combat</button>
    </div>

    <script>
      const objectives = [
        "Deathmatch",
        "Sabotage",
        "Daring Escape",
        "Hold the Fort",
        "Waves of Bad Guys",
        "Escort",
        "Base Defense",
        "Yoink and Skedaddle",
        "Peace Makers",
        "The Arrest"
      ];

      const combatTypes = [
        "Skirmish",
        "Ambush",
        "Targeted Strike",
        "Horde of Bad Guys",
        "Elite Team",
        "Stomping Ground",
        "Boss Battle",
        "Puzzle"
      ];

      const obstacles = [
        "Red Barrels",
        "Siege Weapons",
        "Ammo Boxes",
        "Big Drops",
        "Doors",
        "Interactables",
        "Terrain",
        "Platforms"
      ];

      const enemyTypes = [
        "Ambusher",
        "Artillery",
        "Brute",
        "Controller",
        "Leader",
        "Support",
        "Soldier",
        "Skirmisher"
      ];

      function randomEnemyGroup() {
	const shuffled = [...enemyTypes].sort(() => Math.random() - 0.5);
	const count = Math.floor(Math.random() * 3) + 1; // 1–3 enemies
	return shuffled.slice(0, count).join(" + ");
      }

      const generateButton = document.getElementById("generateButton");

      function buildReel(innerEl, list, finalIndex, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(list[Math.floor(Math.random() * list.length)]);
        }

        items.push(list[finalIndex]);

        innerEl.innerHTML = '';

        items.forEach(text => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = text;
          innerEl.appendChild(div);
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';

        const targetY = -(SPIN_COUNT * 80);

        innerEl.getBoundingClientRect();

        innerEl.style.transition =
          `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

        innerEl.style.transform = `translateY(${targetY}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;

        buildReel(
          document.getElementById('inner-objective'),
          objectives,
          Math.floor(Math.random() * objectives.length),
          1800
        );

        buildReel(
          document.getElementById('inner-combat'),
          combatTypes,
          Math.floor(Math.random() * combatTypes.length),
          2200
        );

        buildReel(
          document.getElementById('inner-obstacle'),
          obstacles,
          Math.floor(Math.random() * obstacles.length),
          2600
        );

        const enemyResults = [];

for (let i = 0; i < 30; i++) {
  enemyResults.push(randomEnemyGroup());
}

const finalEnemy = randomEnemyGroup();

enemyResults.push(finalEnemy);

const enemyInner = document.getElementById('inner-enemy');

enemyInner.innerHTML = '';

enemyResults.forEach(text => {
  const div = document.createElement('div');
  div.className = 'reel-item';
  div.textContent = text;
  enemyInner.appendChild(div);
});

enemyInner.style.transition = 'none';
enemyInner.style.transform = 'translateY(0)';

const targetY = -(30 * 80);

enemyInner.getBoundingClientRect();

enemyInner.style.transition =
  `transform 3000ms cubic-bezier(0.25, 0.1, 0.2, 1)`;

enemyInner.style.transform = `translateY(${targetY}px)`;

        setTimeout(() => {
          generateButton.disabled = false;
        }, 3100);
      }

      generateButton.addEventListener("click", spinReels);

      (function initReels() {
        const reels = [
          {
            el: document.getElementById('inner-objective'),
            list: objectives
          },
          {
            el: document.getElementById('inner-combat'),
            list: combatTypes
          },
          {
            el: document.getElementById('inner-obstacle'),
            list: obstacles
          },
          {
            el: document.getElementById('inner-enemy'),
            list: enemyTypes
          }
        ];

        reels.forEach(({ el, list }) => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent =
            list[Math.floor(Math.random() * list.length)];
          el.appendChild(div);
        });
      })();
    </script>
  </body>
</html>

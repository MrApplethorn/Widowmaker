<!DOCTYPE html>
<html>
  <head>
    <title>Widowmaker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Widowmaker</h1>
      <p class="intro-text">Unsure of what your next combat is going to look like? Click on Generate Combat to be assailed with enough inspiration to last a whole session.</p>
      <button><a href="https://mrapplethorn.github.io/Deck-of-Many-Things/">Oracle</a></button><button><a href="https://mrapplethorn.github.io/Random-NPC-Generator/">Towncrier</a></button>
      <div class="reels">
        <div class="reel-wrapper">
          <div class="reel-label">Combat Objective</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-objective"></div>
          </div>
          <div class="description-panel" id="description-objective"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Combat Type</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-combat"></div>
          </div>
          <div class="description-panel" id="description-combat"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Combat Environment</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-obstacle"></div>
          </div>
          <div class="description-panel" id="description-obstacle"></div>
        </div>
        <div class="reel-wrapper">
          <div class="reel-label">Enemy Roles</div>
          <div class="reel-outer">
            <div class="reel-inner" id="inner-enemy"></div>
          </div>
          <div class="description-panel" id="description-enemy"></div>
        </div>
      </div>
      <button id="generateButton">Generate Combat</button>
    </div>

    <script>
      const objectives = [
        "Deathmatch",
        "Sabotage",
        "Daring Escape",
        "Hold the Fort",
        "Waves of Bad Guys",
        "Escort",
        "Base Defense",
        "Yoink and Skedaddle",
        "Peace Makers",
        "The Arrest"
      ];

      const combatTypes = [
        "Skirmish",
        "Ambush",
        "Targeted Strike",
        "Horde of Bad Guys",
        "Elite Team",
        "Stomping Ground",
        "Boss Battle",
        "Puzzle"
      ];

      const obstacles = [
        "Red Barrels",
        "Siege Weapons",
        "Ammo Boxes",
        "Big Drops",
        "Doors",
        "Interactables",
        "Terrain",
        "Platforms"
      ];

      const enemyTypes = [
        "Ambusher",
        "Artillery",
        "Brute",
        "Controller",
        "Support",
        "Soldier",
        "Skirmisher"
      ];

      const descriptions = {
        // Objectives
        "Deathmatch":         "The players need to destroy the opposition.",
        "Sabotage":           "The players need to remove someone or something from the equation, preferable before the enemy uses it in their ritual.",
        "Daring Escape":      "The players need to get to a safe point.",
        "Hold the Fort":      "The players need to keep enemies out until reinforcements arrive.",
        "Waves of Bad Guys":  "The players need to survive as long as possible as a new wave of monsters arrive every round.",
        "Escort":             "The players need to defend another (player) character, probably until it can do it's thing to change the tides of battle.",
        "Base Defense":       "The players need to defend an item in their home or some other place from being stolen or otherwise removed.",
        "Yoink and Skedaddle":"The players need to grab a specific item and get out, preferably before the enemies notices them.",
        "Peace Makers":       "The players need to make sure that two parties do not come to blows.",
        "The Arrest":         "The players need to incapacitate and capture one of the enemies.",
        // Combat Types
        "Skirmish":           "The enemy is here to kill the players, easy as that.",
        "Ambush":             "The enemy is (partly) hidden at the start of combat, and will use that fact to skew the combat in their favor.",
        "Targeted Strike":    "The enemy is too strong, therefore the players are here to weaken, not kill them.",
        "Horde of Bad Guys":  "The enemy is a very big group of weak creatures, do the players burn through their resources so as to quickly move to the next problem.",
        "Elite Team":         "The enemy is a small group of iconic enemies banded together to go toe to toe with the players.",
        "Stomping Ground":    "The enemy is weak but doesn't know it yet, make the players feel way stronger than they are.",
        "Boss Battle":        "The enemy is a single large threat, sometimes with a few underlings.",
        "Puzzle":             "The enemy can not be brought down in a simple war of attrition, there is a trick to it.",
        // Obstacles
        "Red Barrels":        "The environment features containers that will explode when interacted with.",
        "Siege Weapons":      "The environment features large siege weapons that reload slowly, luckily they are ready to be fired with once.",
        "Ammo Boxes":         "The environment features limited-use items.",
        "Big Drops":          "The environment features cliffs or similar drops that both players or their enemies can be pushed off of.",
        "Doors":              "The environment features chokepoints or even a number of closed doors that, when unlocked, can change the layout of the battlefield.",
        "Interactables":      "The environment features levers or buttons that change aspects of the battlefield.",
        "Terrain":            "The environment features regions that are more difficult to traverse or deal environmental damage.",
        "Platforms":          "The environment features differences in height",
        // Enemy Types
        "Ambusher":           "This enemy can hide, become invisible, or otherwise disappear from sight.",
        "Artillery":          "This enemy is great at long range. Most are weak in melee and will try to move away from any foes within 30 feet.",
        "Brute":              "This enemy's damage cannot be ignored. It hits hard and has a lot of hit points.",
        "Controller":         "This enemy has the ability to debuff, hamper, and move players.",
        "Support":            "This enemy can summon reinforcements, buff their allies, and grand allies extra movement and actions.",
        "Soldier":            "This enemy engages those who are strong in melee to protect their weaker allies.",
        "Skirmisher":         "This enemy prefers to bother those weaker in melee and can outrun and outmaneuver most player characters."
      };

      function fillDescriptionPanel(panel, words) {
        const describedWords = words
          .map(word => ({ word, desc: descriptions[word] }))
          .filter(({ desc }) => desc);

        if (!describedWords.length) return false;

        panel.innerHTML = '';

        describedWords.forEach(({ word, desc }, i) => {
          if (i > 0) panel.appendChild(document.createElement('hr'));

          const title = document.createElement('strong');
          title.textContent = word;
          panel.appendChild(title);

          const body = document.createElement('p');
          body.textContent = desc;
          panel.appendChild(body);
        });

        return true;
      }

      function closeDescriptionPanels() {
        document.querySelectorAll('.description-panel.active').forEach(panel => {
          panel.classList.remove('active');
        });
      }

      function toggleDescriptionPanel(words, panelId) {
        const panel = document.getElementById(panelId);
        if (!panel) return;

        if (panel.classList.contains('active')) {
          panel.classList.remove('active');
          return;
        }

        if (!fillDescriptionPanel(panel, words)) return;

        panel.classList.add('active');
      }

      function makeReelItem(text, categoryLabel, panelId, showInfo = true) {
        const div = document.createElement('div');
        div.className = 'reel-item';

        const words = text.split(' + ');
        words.forEach((word, i) => {
          const span = document.createElement('span');
          span.textContent = word;
          div.appendChild(span);

          if (i < words.length - 1) {
            const sep = document.createElement('span');
            sep.textContent = ' + ';
            sep.className = 'separator';
            div.appendChild(sep);
          }
        });

        if (showInfo && words.some(word => descriptions[word])) {
          const btn = document.createElement('button');
          btn.className = 'info-btn';
          btn.textContent = '?';
          btn.title = `Learn more about this ${categoryLabel.toLowerCase()} roll`;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDescriptionPanel(words, panelId);
          });
          div.appendChild(btn);
        }

        return div;
      }

      function randomGroup(list, minCount = 1, maxCount = 3) {
        const shuffled = [...list].sort(() => Math.random() - 0.5);
        const count = Math.floor(Math.random() * (maxCount - minCount + 1)) + minCount;
        return shuffled.slice(0, count).join(' + ');
      }

      const generateButton = document.getElementById("generateButton");

      function buildReel(innerEl, list, finalIndex, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(list[Math.floor(Math.random() * list.length)]);
        }
        items.push(list[finalIndex]);

        innerEl.innerHTML = '';
        items.forEach((text, i) => {
          innerEl.appendChild(makeReelItem(text, innerEl.dataset.category, innerEl.dataset.panelId, i === items.length - 1));
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        const targetY = -(SPIN_COUNT * 80);
        innerEl.getBoundingClientRect();
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${targetY}px)`;
      }

      function buildGroupReel(innerEl, list, spinDuration, minCount = 1, maxCount = 3) {
        const SPIN_COUNT = 30;
        const items = [];

        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(randomGroup(list, minCount, maxCount));
        }
        items.push(randomGroup(list, minCount, maxCount));

        innerEl.innerHTML = '';
        items.forEach((text, i) => {
          innerEl.appendChild(makeReelItem(text, innerEl.dataset.category, innerEl.dataset.panelId, i === items.length - 1));
        });

        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${-(SPIN_COUNT * 80)}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;
        closeDescriptionPanels();

        buildGroupReel(document.getElementById('inner-objective'), objectives, 1800, 1, 2);
        buildGroupReel(document.getElementById('inner-combat'), combatTypes, 2200, 1, 2);
        buildGroupReel(document.getElementById('inner-obstacle'), obstacles, 2600, 2, 4);
        buildGroupReel(document.getElementById('inner-enemy'), enemyTypes, 3000, 1, 4);

        setTimeout(() => {
          generateButton.disabled = false;
        }, 3100);
      }

      generateButton.addEventListener("click", spinReels);

      (function initReels() {
        const reels = [
          { el: document.getElementById('inner-objective'), list: objectives, min: 1, max: 2, category: 'Combat Objective', panelId: 'description-objective' },
          { el: document.getElementById('inner-combat'), list: combatTypes, min: 1, max: 2, category: 'Combat Type', panelId: 'description-combat' },
          { el: document.getElementById('inner-obstacle'), list: obstacles, min: 2, max: 4, category: 'Combat Environment', panelId: 'description-obstacle' },
          { el: document.getElementById('inner-enemy'), list: enemyTypes, min: 1, max: 4, category: 'Enemy Roles', panelId: 'description-enemy' }
        ];

        reels.forEach(({ el, category, panelId }) => {
          el.dataset.category = category;
          el.dataset.panelId = panelId;
        });
      })();
    </script>
  </body>
</html>
